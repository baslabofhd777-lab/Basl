name: "Smart Contract QA & Copilot Merge"

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  smart-contract-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # خطوة تشغيل أداة Slither لفحص ثغرات العقود الذكية تلقائياً
      - name: Run Slither Security Scan
        uses: crytic/slither-action@v0.4.0
        continue-on-error: false # سيتوقف العمل تماماً إذا وُجدت ثغرة خطيرة

  auto-approve-and-merge:
    needs: smart-contract-scan # لن يشتغل هذا الجزء إلا إذا نجح فحص العقود الذكية أعلاه
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copilot Review and Merge
        uses: github/copilot-review-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          instructions: |
            بما أن فحص العقود الذكية السكيورتي (Slither Scan) قد نجح تماماً ولم يجد ثغرات حرجة:
            1. راجع منطق عمل العقد الذكي وتأكد من سلامة التعديل.
            2. قم بالموافقة (Approve) ودمج الكود (Merge) فوراً لإنهاء العمل.
