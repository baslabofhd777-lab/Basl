name: "Smart Contract QA"

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  smart-contract-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # فحص ثغرات العقود الذكية تلقائياً بأداة Slither
      - name: Run Slither Security Scan
        uses: crytic/slither-action@v0.4.0
        with:
          fail-on: high
